[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairbench-ai"
version = "0.18.4"
description = "FairBench - AI model benchmarking suite with SWE-bench integration"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
ml = [
    # Heavy ML stack for quality benchmarks and SWE-bench integration.
    # Upper bounds guard against upstream API drift breaking lazy imports.
    "lm-eval>=0.4,<1.0",
    "swebench>=2.0,<3.0",
]
all = ["fairbench-ai[ml]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "huggingface-hub>=0.20",
]

[project.scripts]
fairbench = "fairbench.cli:cli"

[tool.setuptools.packages.find]
include = ["fairbench*"]

[tool.setuptools]
license-files = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
