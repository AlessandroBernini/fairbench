version: 2

updates:
  - package-ecosystem: "pypi"
    directory: "/"
    target-repository:
      type: github
      owner: ${{ github.actor }}
      name: fairbench
    update-schedule:
      # Review and update dependencies weekly.
      interval: "weekly"
    open-pull-requests-limit: 10
    packages:
      - "*.txt"
      - "*.toml"
      - "*.cfg"
      - "*.ini"
      - "*.yaml"
      - "*.yml"
    labels:
      - "dependencies"

  # Optional: auto-update non-Python build/runtime dependencies.
  # Uncomment and configure additional ecosystems as needed (e.g., npm, Docker).
  # - package-ecosystem: "npm"
  #   directory: "/home/jarvispi/fairbench"
  #   target-repository:
  #     type: github
  #     owner: ${{ github.actor }}
  #     name: fairbench
  #   update-schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 10
