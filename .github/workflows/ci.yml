name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with pytest (coverage gate)
        run: pytest -q --cov=fairbench --cov-report=term --cov-fail-under=50 --tb=short

      - name: Lint with ruff
        run: ruff check fairbench/ tests/ scripts/

      - name: Type check with mypy
        run: mypy fairbench/ --ignore-missing-imports
