name: Discover Models

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Run discovery script
        run: python scripts/cron/discover_models.py

      - name: Commit report
        run: |
          git config --global user.name "fairbench-bot"
          git config --global user.email "fairbench-bot@users.noreply.github.com"
          git add discovered/
          git diff --cached --quiet || git commit -m "chore: update model discovery report"

      - name: Check for new models
        id: check
        run: |
          REPORT=$(cat discovered/new-models-*.md)
          echo "$REPORT"
          COUNT=$(echo "$REPORT" | grep -c '^| \`' || true)
          echo "new_count=$COUNT" >> "$GITHUB_OUTPUT"
          # Write report to a temp file to avoid GITHUB_OUTPUT parsing issues with markdown
          echo "$REPORT" > /tmp/discovered-report.md

      - name: Create PR for new models
        if: steps.check.outputs.new_count > '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add discovered models to registry"
          title: "chore: new GGUF models discovered"
          body: |
            Automated model discovery found new GGUF models.
            Review and merge to update the model registry.
          branch: auto/new-models
          base: main
