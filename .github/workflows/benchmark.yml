name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FairBench
        run: |
          pip install --upgrade pip
          pip install fairbench-ai[dev]

      - name: Verify installation
        run: fairbench verify
