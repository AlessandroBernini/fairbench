name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "ci@fairbench.dev"
          git config --global user.name "FairBench CI"

      - name: Determine version
        run: |
          pip install gh
          python scripts/bump_version.py

      - name: Clean build artifacts
        run: rm -rf dist/ build/ *.egg-info

      - name: Build package
        run: |
          pip install build && python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          VERSION=$(python -c "import re; print(re.search(r'version\s*=\s*\"(\d+\.\d+\.\d+)\"", open('pyproject.toml').read()).group(1))"
          echo "Publishing version: $VERSION"
          if twine upload dist/* 2>&1 | grep -q "File already exists"; then
            echo "⚠️ Version $VERSION already exists on PyPI. Skipping."
          else
            echo "✅ Published successfully!"
          fi
