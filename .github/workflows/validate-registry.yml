name: Validate registry

on:
  push:
    paths:
      - 'fairbench/registry.py'
  pull_request:
    paths:
      - 'fairbench/registry.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Validate registry
        run: |
          pip install -e .
          python scripts/cron/validate_registry.py
